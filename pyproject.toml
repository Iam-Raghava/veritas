[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas-tms"
version = "0.13.0"
description = "Truth maintenance for AI agents: automated principled belief retraction"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "RAGS" }]
keywords = ["ai", "agents", "memory", "belief-revision", "truth-maintenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
urls = { Homepage = "https://github.com/Iam-Raghava/veritas" }

[project.optional-dependencies]
nli = ["transformers>=4.40", "torch>=2.0"]
semantic = ["sentence-transformers>=2.2.0"]
vector = ["numpy>=1.24", "onnxruntime>=1.16"]
all = [
    "transformers>=4.40",
    "torch>=2.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24",
    "onnxruntime>=1.16",
]

[project.scripts]
veritas = "veritas.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["veritas*"]

[tool.mypy]
python_version = "3.10"
# Optional third-party dependencies may not be installed; their imports
# are guarded at runtime.
ignore_missing_imports = true
